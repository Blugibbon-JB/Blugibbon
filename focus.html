<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor Focus</title>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#F7F8FA; --card:#FFFFFF; --line:#ECEEF1; --text:#1F2937; --muted:#6B7280; --faint:#9CA3AF; --soft:#F3F4F6; --hover:#F9FAFB;
  --blue:#2563EB; --green:#047857; --green-soft:#ECFDF5; --amber:#B45309; --amber-soft:#FFF7E6; --purple:#6D28D9; --purple-soft:#F3F0FF; --red:#B91C1C;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111827; --card:#1A2232; --line:#2A3446; --text:#F3F4F6; --muted:#A3AAB8; --faint:#6B7486; --soft:#243044; --hover:#1F293B;
    --blue:#60A5FA; --green:#34D399; --green-soft:#12322A; --amber:#FBBF24; --amber-soft:#3A2E12; --purple:#A78BFA; --purple-soft:#2B2547; --red:#F87171; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:14px;margin:0;font-weight:650}
.who{color:var(--faint);font-size:12px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--muted);padding:3px 8px;font-size:11.5px}
.seg button.on{background:var(--text);color:var(--bg)}
.tabs{display:flex;gap:2px;margin-top:10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:7px 10px 8px;color:var(--muted);font-size:12.5px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab b{font-size:13px;margin-right:4px;color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--c,var(--blue));font-weight:600}
.tab.on b{color:var(--c)}
.tab .zero{color:var(--faint)}
.wrap{padding:6px 14px 30px;max-width:1000px;margin:0 auto}
.hint{color:var(--faint);font-size:11.5px;margin:6px 2px 6px}
.list{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.row.done{opacity:.45}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--soft);white-space:nowrap}
.chip.all{background:var(--green-soft);color:var(--green)}
.chip.some{background:var(--amber-soft);color:var(--amber)}
.chip.close{background:var(--purple-soft);color:var(--purple)}
.chip.more{background:none;color:var(--faint);padding-left:2px}
.right{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.badge{font-size:11.5px;color:var(--muted);white-space:nowrap}
.ic{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0}
.ic:hover{border-color:var(--muted)}
.ic.ok{background:#047857;border-color:#047857;color:#fff}
.ic.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.empty{color:var(--muted);padding:18px 12px;text-align:center}
.more-btn{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:7px;color:var(--blue);font-size:12px}
.status{padding:30px 14px;text-align:center;color:var(--muted)}
.signin{margin-top:10px;background:var(--blue);color:#fff;border:0;border-radius:7px;padding:8px 16px;font-size:14px}
.foot{color:var(--faint);font-size:11px;margin-top:10px;text-align:right}
.foot a{color:var(--blue)}
@media (max-width:520px){ .row{grid-template-columns:1fr} .right{justify-content:flex-start} }
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="top">
    <h1>🎯 Doctor focus</h1>
    <span class="who" id="who"></span>
    <span class="spacer"></span>
    <span class="seg" id="winSeg" title="How far ahead to look"><button data-w="14">2 wks</button><button data-w="28" class="on">4 wks</button><button data-w="56">8 wks</button></span>
    <span class="seg" id="scopeSeg" hidden><button data-s="mine" class="on">Mine</button><button data-s="all">Everyone</button></span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="wrap" id="app"><div class="status">Loading…</div></div>
<script>
/* ===================== pure logic (testable) ===================== */
const Focus = (() => {
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const nice = d => { const t = new Date(d + 'T00:00:00Z'); return `${DOW[t.getUTCDay()]} ${t.getUTCDate()} ${MON[t.getUTCMonth()]}`; };
  const short = d => { const t = new Date(d + 'T00:00:00Z'); return `${t.getUTCDate()} ${MON[t.getUTCMonth()]}`; };
  const span = (a, b) => a === b ? nice(a) : `${nice(a)} – ${nice(b)}`;
  const arr = x => Array.isArray(x) ? x : Object.values(x || {});
  const key = s => String(s || '').trim().toUpperCase();
  const sydToday = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Australia/Sydney', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());

  // classify one calendar entry
  function kind(e) {
    const st = String(e.status || '').trim().toLowerCase(), ti = String(e.title || '').trim().toLowerCase();
    if (e.type === 'placement' || e.source === 'timesheets' || e.source === 'placements' || e.source === 'clickup' || /^book/.test(st) || /^booked\b/.test(ti)) return 'booked';
    if (/^(unavailable|away|holiday|leave|sick)/.test(st) || /^(away|unavailable|holiday|on leave|leave)\b/.test(ti)) return 'away';
    if (st === 'available') return 'avail';
    if (st === 'tentative') return 'tent';
    return 'other';
  }
  function norm(e) {
    const s = String(e.start || '').slice(0, 10); if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    let en = String(e.end || '').slice(0, 10); if (!/^\d{4}-\d{2}-\d{2}$/.test(en) || en <= s) en = addDays(s, 1);
    return { s, e: en, k: kind(e), ev: e };       // e = exclusive end
  }
  // merge sorted day list into ranges
  function ranges(days) {
    const out = []; for (const d of days) { const r = out[out.length - 1]; if (r && addDays(r[1], 1) === d) r[1] = d; else out.push([d, d]); } return out;
  }

  /* nodes: [{uid, node}] where node = users/{uid}; opts: {today, win, contacted:{AHPRA: date}} */
  function build(nodes, opts) {
    const today = opts.today, win = opts.win || 28, until = addDays(today, win);   // window = [today, until)
    const docs = {};            // key -> doctor info (merged across calendars)
    const evBy = {};            // key -> [normalised entries]
    for (const { uid, node } of nodes) {
      for (const d of arr(node && node.doctors)) {
        if (!d) continue; const k = key(d.ahpra_id || d.name); if (!k) continue;
        const o = docs[k] || (docs[k] = { k, name: String(d.name || '').trim() || k, level: '', spec: '', cu: '', hidden: true, uids: [] });
        if (!d.hidden) o.hidden = false;
        o.level = o.level || d.level || '';
        if (!o.spec) { const parts = [...new Set(String([d.specialty, d.prefs].filter(Boolean).join(',')).split(/[,;]+/).map(x => x.trim()).filter(Boolean))]; o.spec = parts.slice(0, 2).join(', ') + (parts.length > 2 ? ' +' + (parts.length - 2) : ''); } o.cu = o.cu || d.clickup_url || '';
        if (!o.uids.includes(uid)) o.uids.push(uid);
      }
      for (const e of arr(node && node.events)) {
        if (!e) continue; const k = key(e.ahpra_id || (e.placement_data && e.placement_data.doctor_id)); if (!k) continue;
        const n = norm(e); if (n) (evBy[k] = evBy[k] || []).push(n);
      }
    }
    const isBusy = (k, d) => (evBy[k] || []).some(x => (x.k === 'booked' || x.k === 'away') && d >= x.s && d < x.e);
    const freeOn = (k, d) => !isBusy(k, d) && (evBy[k] || []).some(x => (x.k === 'avail' || x.k === 'tent') && d >= x.s && d < x.e);

    // ---------- 1 + 2: job matches ----------
    const jobs = [], nearJobs = [], inJob = new Set(), inNear = new Set();
    const seenJob = new Set();
    for (const { uid, node } of nodes) {
      for (const [jk, rec] of Object.entries((node && node.jobmatches) || {})) {
        const j = rec && rec.job; if (!j || !j.end || j.end < today) continue;
        if (seenJob.has(jk)) continue; seenJob.add(jk);
        const state = rec.state || null;
        if ((state && state.s) || (opts.dismissed || {})[jk]) continue;   // answered (accepted / not suitable) -> gone
        const dates = arr(j.dates).filter(d => d >= today);
        if (!dates.length) continue;
        const live = [], near = [];
        for (const m of arr(j.docs)) {
          const dk = key(m.k), doc = docs[dk];
          if (doc && doc.hidden) continue;
          const c = dates.filter(d => freeOn(dk, d)).length;
          const row = { k: dk, name: (doc && doc.name) || m.name, level: (doc && doc.level) || m.lv || '', cu: (doc && doc.cu) || m.cu || '', c, n: dates.length,
            tent: !!m.tent, viaNote: !!m.viaNote, why: m.why || '', note: m.note || '' };
          const strong = m.g !== 'near' && c > 0 && (c === dates.length || c / dates.length >= 0.5);
          if (strong) live.push(row);
          else { if (m.g !== 'near') row.why = c ? `free ${c} of ${dates.length} days` : 'no longer free on the job dates'; near.push(row); }
        }
        live.sort((a, b) => b.c - a.c || a.name.localeCompare(b.name));
        const item = { jk, uid, j, state, dates, live, near };
        if (live.length) { jobs.push(item); if (!state) live.forEach(r => inJob.add(r.k)); }
        else if (near.length) { nearJobs.push(item); if (!state) near.forEach(r => inNear.add(r.k)); }
      }
    }
    const byStart = (a, b) => (a.state ? 1 : 0) - (b.state ? 1 : 0) || a.dates[0].localeCompare(b.dates[0]);
    jobs.sort(byStart); nearJobs.sort(byStart);

    // ---------- 4: finishing soon, nothing next ----------
    const finishing = [], inFinish = new Set();
    const soon = addDays(today, Math.min(win, 14));
    for (const [k, evs] of Object.entries(evBy)) {
      const doc = docs[k]; if (!doc || doc.hidden) continue;
      const booked = evs.filter(x => x.k === 'booked');
      // the booking that is running now or starts within the window and ends soonest
      const cur = booked.filter(x => x.e > today && x.s <= soon).sort((a, b) => a.e.localeCompare(b.e));
      for (const b of cur) {
        const last = addDays(b.e, -1);
        if (last < today || last >= soon) continue;
        // next booking that starts within 3 weeks of this one ending
        const next = booked.some(x => x !== b && x.s >= b.s && x.e > b.e && x.s <= addDays(b.e, 21));
        if (next) continue;
        const after = [];
        for (let d = b.e, i = 0; i < 21; d = addDays(d, 1), i++) if (freeOn(k, d)) after.push(d);
        finishing.push({ k, doc, b, last, afterRanges: ranges(after).slice(0, 2) });
        inFinish.add(k);
        break;
      }
    }
    finishing.sort((a, b) => a.last.localeCompare(b.last));

    // ---------- 3: available, no job yet ----------
    const avail = [];
    for (const [k, evs] of Object.entries(evBy)) {
      const doc = docs[k]; if (!doc || doc.hidden) continue;
      if (inJob.has(k) || inNear.has(k) || inFinish.has(k)) continue;
      const days = [], tentDays = []; let notes = [];
      for (let d = today; d < until; d = addDays(d, 1)) {
        if (isBusy(k, d)) continue;
        const a = evs.find(x => (x.k === 'avail' || x.k === 'tent') && d >= x.s && d < x.e);
        if (!a) continue;
        days.push(d); if (a.k === 'tent') tentDays.push(d);
        const t = [a.ev.title, a.ev.notes].filter(x => x && !/^(available|tentative)$/i.test(String(x).trim())).join(' · ');
        if (t && !notes.includes(t)) notes.push(t);
      }
      if (!days.length) continue;
      const lastBooked = evs.filter(x => x.k === 'booked' && x.e <= today).map(x => addDays(x.e, -1)).sort().pop() || '';
      avail.push({ k, doc, days, rg: ranges(days), tent: tentDays.length === days.length ? 'all' : tentDays.length ? 'some' : '', notes: notes.slice(0, 2), lastBooked,
        contacted: (opts.contacted || {})[k] || '' });
    }
    // not-yet-contacted first, then soonest availability, then most days
    avail.sort((a, b) => (a.contacted ? 1 : 0) - (b.contacted ? 1 : 0) || a.days[0].localeCompare(b.days[0]) || b.days.length - a.days.length);

    return { today, win, jobs, nearJobs, avail, finishing, docsCount: Object.values(docs).filter(d => !d.hidden).length };
  }
  return { build, addDays, nice, short, span, ranges, sydToday, key };
})();
if (typeof module !== 'undefined') module.exports = Focus;
</script>

<script>
/* ===================== UI ===================== */
if (typeof firebase !== 'undefined') (function () {
  firebase.initializeApp({
    apiKey: "AIzaSyCJBHYoYk7fG-5h-tAcU897ySV4AUbThPY",
    authDomain: "blugibbon-av-cal-2.firebaseapp.com",
    databaseURL: "https://blugibbon-av-cal-2-default-rtdb.firebaseio.com",
    projectId: "blugibbon-av-cal-2",
    appId: "1:324678581656:web:6812ee55aab867aa2f3fed"
  });
  const auth = firebase.auth(), db = firebase.database();
  const ADMINS = ['josh@blugibbon.com.au'];
  const CAL_URL = 'https://blugibbon-jb.github.io/Blugibbon/availability2.html';
  const N = Focus, $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const arr = v => Array.isArray(v) ? v : Object.values(v || {});
  const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let user = null, scope = store.get('focus.scope', 'mine'), win = Number(store.get('focus.win', '28')) || 28, tab = store.get('focus.tab', '');
  let data = {}, ref = null, showAll = false;

  const setSeg = (seg, attr, val) => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset[attr] === String(val)));
  $('winSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; win = Number(b.dataset.w); store.set('focus.win', win); setSeg($('winSeg'), 'w', win); render(); };
  $('scopeSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; scope = b.dataset.s; store.set('focus.scope', scope); setSeg($('scopeSeg'), 's', scope); listen(); };

  function signInView(msg) {
    $('hdr').hidden = true;
    $('app').innerHTML = `<div class="status">${msg || 'Sign in with your Blugibbon Google account to see your doctors.'}<br><button class="signin" id="si">Sign in with Google</button></div>`;
    $('si').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
      if (/popup/.test(err.code || '')) auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); else signInView('Sign-in failed: ' + esc(err.message));
    });
  }
  auth.getRedirectResult().catch(() => {});
  auth.onAuthStateChanged(u => {
    user = u;
    if (!u) { if (ref) ref.off(); signInView(); return; }
    $('hdr').hidden = false; $('who').textContent = (u.displayName || u.email).split(/[ -]/)[0];
    const admin = ADMINS.includes(String(u.email).toLowerCase());
    $('scopeSeg').hidden = !admin; if (!admin) scope = 'mine';
    setSeg($('scopeSeg'), 's', scope); setSeg($('winSeg'), 'w', win);
    listen();
  });
  function listen() {
    if (ref) ref.off();
    $('app').innerHTML = '<div class="status">Loading…</div>';
    ref = scope === 'all' ? db.ref('users') : db.ref('users/' + user.uid);
    ref.on('value', snap => { const v = snap.val() || {}; data = scope === 'all' ? v : { [user.uid]: v }; render(); },
      err => { $('app').innerHTML = `<div class="status">Couldn't read the calendar (${esc(err.code || err.message)}).</div>`; });
  }
  const hiddenNow = new Set();        // hidden the instant you click, before Firebase answers
  function dismissedMap() {
    const out = {};
    for (const node of Object.values(data)) for (const k of Object.keys((node && node.focus && node.focus.dismissed) || {})) out[k] = 1;
    hiddenNow.forEach(k => out[k] = 1);
    return out;
  }
  function contactedMap() {
    const out = {}, cutoff = N.addDays(N.sydToday(), -7);
    for (const node of Object.values(data)) for (const [k, d] of Object.entries((node && node.focus && node.focus.contacted) || {})) if (d >= cutoff && (!out[k] || d > out[k])) out[k] = d;
    return out;
  }

  // ---------- formatting helpers ----------
  const first = n => String(n || '').replace(/\(.*?\)/g, '').trim().split(/\s+/)[0] || n;
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dm = d => { const t = new Date(d + 'T00:00:00Z'); return [t.getUTCDate(), MON[t.getUTCMonth()]]; };
  function range(a, b) { const [d1, m1] = dm(a), [d2, m2] = dm(b); return a === b ? `${d1} ${m1}` : m1 === m2 ? `${d1}–${d2} ${m1}` : `${d1} ${m1} – ${d2} ${m2}`; }
  function shortTitle(t) {        // "Sydney Adventist Hospital – PGY4+ (Pager 21), PGY3+ … General Medicine" -> tidy
    let [site, role] = String(t || '').split(' – ');
    site = (site || '').replace(/\b(Hospital|Health Service|Health|District|Regional|Base|Memorial|Service|Campus)\b/g, '').replace(/\s{2,}/g, ' ').replace(/[\s,&-]+$/, '').trim();
    role = (role || '').replace(/\(.*?\)/g, '').replace(/\s+,/g, ',').replace(/\s{2,}/g, ' ').trim();
    if (role.length > 38) role = role.slice(0, 36).replace(/[\s,]+\S*$/, '') + '…';
    return { site, role };
  }
  const rateShort = r => String(r || '').replace(/\s*\(.*$/, '').trim();
  const lvShort = l => ({ 'Training Registrar': 'Trg Reg', Registrar: 'Reg', Specialist: 'Spec', Senior: 'Senior', Junior: 'Junior' }[l] || l || '');

  // ---------- render ----------
  function render() {
    const today = N.sydToday();
    const F = N.build(Object.entries(data).map(([uid, node]) => ({ uid, node })), { today, win, contacted: contactedMap(), dismissed: dismissedMap() });
    const TABS = [
      ['match', 'Matched', F.jobs.filter(x => !x.state).length, 'var(--green)'],
      ['close', 'Close', F.nearJobs.filter(x => !x.state).length, 'var(--purple)'],
      ['free', 'Free, no job', F.avail.filter(a => !a.contacted).length, 'var(--blue)'],
      ['ending', 'Finishing', F.finishing.length, 'var(--amber)']
    ];
    if (!TABS.some(t => t[0] === tab)) tab = (TABS.find(t => t[2] > 0) || TABS[0])[0];
    $('tabs').innerHTML = TABS.map(([id, label, n, c]) => `<button class="tab ${tab === id ? 'on' : ''}" style="--c:${c}" data-tab="${id}"><b class="${n ? '' : 'zero'}">${n}</b>${label}</button>`).join('');
    $('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; store.set('focus.tab', tab); showAll = false; render(); };

    let rows = [], hint = '';
    if (tab === 'match') { hint = 'Jobs from the inbox your doctors can cover · ✓ every day · ◐ most days'; rows = F.jobs.map(x => jobRow(x, false)); }
    if (tab === 'close') { hint = 'Worth a call – level one step off, or free just around the dates (hover a name for why)'; rows = F.nearJobs.map(x => jobRow(x, true)); }
    if (tab === 'free') { hint = `Free in the next ${win / 7} weeks with nothing booked or matched – market them`; rows = F.avail.map(freeRow); }
    if (tab === 'ending') { hint = 'Bookings ending in the next 2 weeks with nothing lined up after'; rows = F.finishing.map(endRow); }
    const lim = 15;
    $('app').innerHTML = `<div class="hint">${hint}</div><div class="list">${rows.length ? (showAll ? rows : rows.slice(0, lim)).join('') : `<div class="empty">Nothing here right now 🎉</div>`}
      ${rows.length > lim ? `<button class="more-btn" id="more">${showAll ? 'Show fewer' : `Show all ${rows.length}`}</button>` : ''}</div>
      <div class="foot">${F.docsCount} doctors · <a href="${CAL_URL}" target="_blank" rel="noopener">Open calendar ↗</a></div>`;
    if ($('more')) $('more').onclick = () => { showAll = !showAll; render(); };
    wire();
  }

  function jobRow(x, closeTab) {
    const j = x.j, { site, role } = shortTitle(j.title), done = x.state && x.state.s;
    const docs = closeTab ? x.near : x.live;
    const chip = r => {
      const cls = closeTab ? 'close' : r.c === r.n ? 'all' : 'some';
      const mark = closeTab ? '' : r.c === r.n ? '✓ ' : '◐ ';
      const tip = closeTab ? (r.why || 'close match') : r.c === r.n ? `free all ${r.n} days` : `free ${r.c} of ${r.n} days`;
      return `<a class="chip ${cls}" title="${esc(r.name + ' – ' + tip + (r.level ? ' · ' + r.level : ''))}" ${r.cu ? `href="${esc(r.cu)}" target="_blank" rel="noopener"` : ''}>${mark}${esc(label(r))}</a>`;
    };
    const show = docs.slice(0, 5);
    const fc = {}; show.forEach(r => { const f = first(r.name); fc[f] = (fc[f] || 0) + 1; });
    const label = r => { const f = first(r.name); if (fc[f] < 2) return f; const parts = String(r.name).replace(/\(.*?\)/g, '').trim().split(/\s+/); return f + ' ' + (parts[parts.length - 1] || '')[0] + '.'; };
    return `<div class="row ${done ? 'done' : ''}">
      <div><div class="t" title="${esc(j.title)}">${esc(site)}${role ? ` <span style="font-weight:400;color:var(--muted)">· ${esc(role)}</span>` : ''}</div>
        <div class="sub">${esc(range(x.dates[0], x.dates[x.dates.length - 1]))} · ${esc(rateShort(j.rate) || 'rate n/a')}${j.state ? ' · ' + esc(j.state) : ''}${done ? ` · ${x.state.s === 'accepted' ? 'accepted' : 'not suitable'}` : ''}</div>
        <div class="chips">${show.map(chip).join('')}${docs.length > 5 ? `<span class="chip more">+${docs.length - 5}</span>` : ''}</div></div>
      <div class="right">${done ? '' : `<button class="ic ok" title="Accept – create Order" data-act="accepted" data-jk="${esc(x.jk)}" data-uid="${esc(x.uid)}" data-url="${esc(j.accept)}">✓</button>
        <button class="ic" title="Not suitable" data-act="notsuitable" data-jk="${esc(x.jk)}" data-uid="${esc(x.uid)}" data-url="${esc(j.reject)}">✕</button>`}
        ${j.mail ? `<a class="ic" title="Open the email" href="${esc(j.mail)}" target="_blank" rel="noopener">✉</a>` : ''}</div>
    </div>`;
  }
  function freeRow(a) {
    const d = a.doc, rg = a.rg.slice(0, 2).map(r => range(r[0], r[1])).join(', ') + (a.rg.length > 2 ? ` +${a.rg.length - 2}` : '');
    const tip = a.notes.join(' / ');
    return `<div class="row ${a.contacted ? 'done' : ''}">
      <div><div class="t">${d.cu ? `<a href="${esc(d.cu)}" target="_blank" rel="noopener">${esc(d.name)}</a>` : esc(d.name)} <span style="font-weight:400;color:var(--muted)">· ${esc(lvShort(d.level))}${d.spec ? ' · ' + esc(d.spec) : ''}</span></div>
        <div class="sub" ${tip ? `title="${esc(tip)}"` : ''}>Free ${esc(rg)} · ${a.days.length}d${a.tent ? ' · tentative' : ''}${a.notes.length ? ' · 💬' : ''}</div></div>
      <div class="right"><span class="badge">${a.lastBooked ? 'last booked ' + esc(range(a.lastBooked, a.lastBooked)) : 'never booked'}</span>
        <button class="ic ${a.contacted ? 'on' : ''}" title="${a.contacted ? 'Contacted ' + esc(range(a.contacted, a.contacted)) + ' – click to undo' : 'Mark as contacted (hides for 7 days)'}" data-contact="${esc(a.k)}" data-on="${a.contacted ? '1' : ''}">✓</button></div>
    </div>`;
  }
  function endRow(f) {
    const d = f.doc, b = f.b.ev, t = String(b.title || '').trim();
    const where = shortTitle(b.location ? b.location + ' – ' : (t && !/^(booked|booking.*|timesheet)$/i.test(t) ? t : '')).site;
    const next = f.afterRanges.length ? 'free after ' + f.afterRanges.map(r => range(r[0], r[1])).join(', ') : 'no availability logged after';
    return `<div class="row">
      <div><div class="t">${d.cu ? `<a href="${esc(d.cu)}" target="_blank" rel="noopener">${esc(d.name)}</a>` : esc(d.name)} <span style="font-weight:400;color:var(--muted)">· ${esc(lvShort(d.level))}</span></div>
        <div class="sub">${where ? esc(where) + ' · ' : ''}${esc(next)}</div></div>
      <div class="right"><span class="chip some">ends ${esc(range(f.last, f.last))}</span></div>
    </div>`;
  }

  function wire() {
    document.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const jk = b.dataset.jk, act = b.dataset.act, url = b.dataset.url;
      hiddenNow.add(jk); render();                                   // gone straight away
      if (act === 'accepted') { if (url) window.open(url, '_blank', 'noopener'); }   // Accept still opens the Order confirmation
      else if (url) { try { fetch(url, { mode: 'no-cors', cache: 'no-store' }); } catch (e) { new Image().src = url; } }   // Not suitable: recorded quietly, no tab
      const rec = { s: act, by: user.email, at: new Date().toISOString() };
      try { await db.ref(`users/${user.uid}/focus/dismissed/${jk}`).set(rec); } catch (e) { console.warn(e); }
      try { await db.ref(`users/${b.dataset.uid}/jobmatches/${jk}/state`).set(rec); } catch (e) { /* someone else's calendar – view only */ }
    });
    document.querySelectorAll('[data-contact]').forEach(b => b.onclick = async () => {
      const k = b.dataset.contact.replace(/[.#$\[\]\/]/g, '_');
      try { await db.ref(`users/${user.uid}/focus/contacted/${k}`).set(b.dataset.on ? null : N.sydToday()); } catch (e) { console.warn(e); }
    });
  }
})();
</script>
</body>
</html>
